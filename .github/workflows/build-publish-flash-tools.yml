name: Publish Flash Tools

# Manual only, same as the other two. These files are plain scripts (no
# actual build/compile step), so this just packages and publishes whatever
# is currently committed under iso-builder/.
on:
  workflow_dispatch:
    inputs:
      publish_sourceforge:
        description: "Upload the flash tool files to SourceForge"
        type: boolean
        default: true
      publish_github_release:
        description: "Upload the flash tool files to the GitHub 'latest' release"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check required secrets are set
        if: ${{ inputs.publish_sourceforge }}
        run: |
          missing=()
          [ -z "${{ secrets.SOURCEFORGE_SSH_KEY }}" ] && missing+=("SOURCEFORGE_SSH_KEY (secret)")
          [ -z "${{ secrets.SOURCEFORGE_USER }}" ] && missing+=("SOURCEFORGE_USER (secret)")
          [ -z "${{ vars.SOURCEFORGE_PROJECT }}" ] && missing+=("SOURCEFORGE_PROJECT (repo variable)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing SourceForge config: ${missing[*]}. See .github/workflows/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      # One sums file for the whole tool bundle: sha256sum -c flash-tools.sha256
      - name: Generate checksums
        working-directory: iso-builder
        run: sha256sum linuxtv-flash-tool.py flash-tool-windows.bat flash-tool-linux.sh flash-tool-macos.sh USB-GUIDE.md | tee flash-tools.sha256

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxtv-flash-tools
          path: |
            iso-builder/linuxtv-flash-tool.py
            iso-builder/flash-tool-windows.bat
            iso-builder/flash-tool-linux.sh
            iso-builder/flash-tool-macos.sh
            iso-builder/USB-GUIDE.md
            iso-builder/flash-tools.sha256
          retention-days: 30

      # Same release/ folder as the ISO and APK -- not a separate subfolder.
      - name: Publish to SourceForge
        if: ${{ inputs.publish_sourceforge }}
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/sourceforge_key
          chmod 600 ~/.ssh/sourceforge_key
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avP -e "ssh -i ~/.ssh/sourceforge_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            iso-builder/linuxtv-flash-tool.py \
            iso-builder/flash-tool-windows.bat \
            iso-builder/flash-tool-linux.sh \
            iso-builder/flash-tool-macos.sh \
            iso-builder/USB-GUIDE.md \
            iso-builder/flash-tools.sha256 \
            "${SOURCEFORGE_USER}@frs.sourceforge.net:/home/frs/project/${SOURCEFORGE_PROJECT}/release/"

      # Same persistent "latest" release the ISO/APK workflows update.
      - name: Publish to GitHub Release
        if: ${{ inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest --repo "${{ github.repository }}" \
              --title "Latest build" --notes "Automatically updated by CI. Not a tagged version release."
          gh release upload latest --repo "${{ github.repository }}" --clobber \
            iso-builder/linuxtv-flash-tool.py \
            iso-builder/flash-tool-windows.bat \
            iso-builder/flash-tool-linux.sh \
            iso-builder/flash-tool-macos.sh \
            iso-builder/USB-GUIDE.md \
            iso-builder/flash-tools.sha256
