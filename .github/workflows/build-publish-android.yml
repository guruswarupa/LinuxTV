name: Build & Publish Android App

# Manual only, per project preference -- click "Run workflow" in the Actions
# tab whenever there's a release to cut.
on:
  workflow_dispatch:
    inputs:
      publish_sourceforge:
        description: "Upload the release APK to SourceForge"
        type: boolean
        default: true
      publish_github_release:
        description: "Upload the release APK to the GitHub 'latest' release"
        type: boolean
        default: true
      publish_playstore:
        description: "Publish the release AAB to Google Play"
        type: boolean
        default: false
      play_track:
        description: "Google Play track (only used if publishing to Play)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check required secrets are set
        run: |
          missing=()
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64 (secret)")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD (secret)")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing+=("ANDROID_KEY_ALIAS (secret)")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing+=("ANDROID_KEY_PASSWORD (secret)")
          if [ "${{ inputs.publish_sourceforge }}" = "true" ]; then
            [ -z "${{ secrets.SOURCEFORGE_SSH_KEY }}" ] && missing+=("SOURCEFORGE_SSH_KEY (secret)")
            [ -z "${{ secrets.SOURCEFORGE_USER }}" ] && missing+=("SOURCEFORGE_USER (secret)")
            [ -z "${{ vars.SOURCEFORGE_PROJECT }}" ] && missing+=("SOURCEFORGE_PROJECT (repo variable)")
          fi
          if [ "${{ inputs.publish_playstore }}" = "true" ]; then
            [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ] && missing+=("PLAY_SERVICE_ACCOUNT_JSON (secret)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing config: ${missing[*]}. See .github/workflows/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Play rejects any upload whose versionCode was already used, even on
      # a failed/never-uploaded attempt -- so bump it unconditionally on
      # every manual run rather than requiring a human to remember to. This
      # commits the bump straight to the branch that triggered the run, so
      # local checkouts stay in sync with what actually got built/published.
      - name: Bump Android versionCode
        working-directory: linuxtvremote/android/app
        run: |
          current=$(grep -oP 'versionCode \K[0-9]+' build.gradle)
          next=$((current + 1))
          sed -i "s/versionCode ${current}/versionCode ${next}/" build.gradle
          echo "versionCode: ${current} -> ${next}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f: build.gradle is already tracked, but linuxtvremote/.gitignore
          # has a blanket `/android` rule for the (normally-regenerated)
          # native folder, and `git add` refuses ignore-matched paths outright
          # -- even already-tracked ones -- without -f.
          git add -f build.gradle
          git commit -m "chore: bump Android versionCode to ${next} [skip ci]"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: linuxtvremote/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 fails here (tries to touch the
      # removed legacy "tools" package), and relying on whatever Android SDK
      # happens to be preinstalled on the runner image proved unreliable
      # across a few attempts -- its presence and path aren't something this
      # workflow should depend on. Install a known-good cmdline-tools build
      # fresh instead, so this step doesn't depend on the runner image at all.
      # If this download 404s in the future, get a current build number from
      # https://developer.android.com/studio#command-line-tools-only.
      - name: Install Android SDK cmdline-tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install JS dependencies
        working-directory: linuxtvremote
        run: npm ci

      # npm's cache-restore path on GitHub Actions runners has been known to
      # drop the executable bit off prebuilt binaries it extracts -- Hermes
      # ships hermesc this way, and losing +x makes Gradle's
      # createBundleReleaseJsAndAssets fail with "A problem occurred starting
      # process 'command .../hermesc'". Reassert it explicitly rather than
      # relying on npm to have preserved it.
      - name: Ensure Hermes compiler is executable
        working-directory: linuxtvremote
        run: chmod +x node_modules/react-native/sdks/hermesc/*/hermesc

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > linuxtvremote/android/app/keystore.jks

      - name: Build release AAB + APK
        working-directory: linuxtvremote/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f linuxtvremote/android/app/keystore.jks

      # Both SourceForge and GitHub Releases are meant to always offer the
      # same fixed download name, not a versioned build filename.
      - name: Rename APK for release
        run: |
          cp linuxtvremote/android/app/build/outputs/apk/release/app-release.apk \
             linuxtvremote/android/app/build/outputs/apk/release/LinuxTVRemote.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linuxtvremote-release
          path: |
            linuxtvremote/android/app/build/outputs/bundle/release/*.aab
            linuxtvremote/android/app/build/outputs/apk/release/LinuxTVRemote.apk
          retention-days: 30

      - name: Publish APK to SourceForge
        if: ${{ inputs.publish_sourceforge }}
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/sourceforge_key
          chmod 600 ~/.ssh/sourceforge_key
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avP -e "ssh -i ~/.ssh/sourceforge_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            linuxtvremote/android/app/build/outputs/apk/release/LinuxTVRemote.apk \
            "${SOURCEFORGE_USER}@frs.sourceforge.net:/home/frs/project/${SOURCEFORGE_PROJECT}/release/"

      # Keeps one persistent "latest" release as the standing download point,
      # same idea as the SourceForge release/ folder -- not a fresh
      # numbered release on every manual dispatch.
      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest --repo "${{ github.repository }}" \
              --title "Latest build" --notes "Automatically updated by CI. Not a tagged version release."
          gh release upload latest --repo "${{ github.repository }}" --clobber \
            linuxtvremote/android/app/build/outputs/apk/release/LinuxTVRemote.apk

      # First-ever Play Store release for an app can only be uploaded by hand
      # through the Play Console -- the Publishing API only works once a
      # listing with at least one release already exists, which is already
      # the case here.
      - name: Publish AAB to Google Play
        if: ${{ inputs.publish_playstore }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.guruswarupa.linuxtvremote
          releaseFiles: linuxtvremote/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
